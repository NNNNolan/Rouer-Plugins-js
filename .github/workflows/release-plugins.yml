name: Release plugins

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: Install build tools
        run: npm --prefix sdk/js ci
      - name: Build each plugin
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem ./plugins -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'plugin.json') })
          if ($projects.Count -eq 0) { throw 'No plugin manifests found.' }
          foreach ($project in $projects) {
            node ./sdk/js/build.mjs $project.FullName
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($project.Name)" }
          }
      - name: Create archives and index
        run: pwsh -File ./package-release.ps1 -Tag "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "release-notes/$RELEASE_TAG.md" ]; then
            printf '\n## 本次发布说明\n\n' >> artifacts/release/release-notes.md
            cat "release-notes/$RELEASE_TAG.md" >> artifacts/release/release-notes.md
          fi
          gh release create "$RELEASE_TAG" artifacts/release/*.zip artifacts/release/release-index.json --verify-tag --title "JS 插件 $RELEASE_TAG" --generate-notes --notes "$(cat artifacts/release/release-notes.md)" --draft
          gh release edit "$RELEASE_TAG" --draft=false
